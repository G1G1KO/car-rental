{% extends 'base.html' %}

{% block title %}მანქანის რედაქტირება - Car Rental{% endblock title %}

{% block content %}
<div class="auth-card">
    <h2>მანქანის რედაქტირება</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">შენახვა</button>
    </form>

    <div class="switch-auth">
        <a href="{% url 'cars:car-detail' car.pk %}">გაუქმება</a>
    </div>
</div>
{% endblock content %}
