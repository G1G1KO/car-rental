{% extends 'base.html' %}

{% block title %}მანქანის წაშლა - WeRent{% endblock title %}

{% block content %}
<div class="auth-card delete-card">
    <div class="auth-header">
        <h2 class="text-danger">მანქანის წაშლა</h2>
        <p class="auth-subtitle">ეს მოქმედება შეუქცევადია</p>
    </div>

    <div class="delete-warning-box">
        <p>
            დარწმუნებული ხარ, რომ გინდა სამუდამოდ წაშალო 
            <strong>{{ car.brand }} {{ car.model }} ({{ car.year }})</strong>?
        </p>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="delete-actions">
            <a href="{% url 'cars:car-detail' car.pk %}" class="btn-cancel">გაუქმება</a>
            <button type="submit" class="btn-delete-confirm">დიახ, წაშალე</button>
        </div>
    </form>
</div>
{% endblock content %}
